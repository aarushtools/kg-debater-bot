# TODO: install speedups later

[project]
name = "kg-debater-bot"
version = "0.1.0"
description = "A discord bot for the Knowledge Gap discord server"
readme = "README.md"
requires-python = ">=3.13.6"
dependencies = [
    "aiocache>=0.12.3",
    "easy-pil>=0.6.1",
    "fastapi>=0.136.3",
    "fastapi-discord>=0.1.6",
    "hikari-lightbulb>=3.2.4",
    "hikari-miru>=4.2.0",
    "hikari>=2.5.0",
    "jinja2>=3.1.6",
    "tortoise-orm[asyncpg,ptpython]>=1.1.7",
    "tzdata>=2026.2",
    "uvicorn[standard]>=0.49.0",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.32",
]

[tool.tortoise]
tortoise_orm = "secret.TORTOISE_ORM"
