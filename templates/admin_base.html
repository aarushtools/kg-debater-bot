<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}KG Admin{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
    <div class="min-h-screen lg:grid lg:grid-cols-[260px_1fr]">
        <aside class="border-b border-zinc-800 bg-zinc-950 px-5 py-5 lg:min-h-screen lg:border-b-0 lg:border-r">
            <a href="/admin" class="block space-y-1">
                <p class="text-xs font-semibold uppercase tracking-wide text-indigo-300">Knowledge Gap</p>
                <h1 class="text-xl font-semibold tracking-tight">Admin panel</h1>
            </a>

            <nav class="mt-8 grid gap-1">
                <a class="rounded-md px-3 py-2 text-sm text-zinc-300 hover:bg-zinc-900 hover:text-white" href="/admin">Dashboard</a>
                <a class="rounded-md px-3 py-2 text-sm text-zinc-300 hover:bg-zinc-900 hover:text-white" href="/admin/tiers">Tiers</a>
                <a class="rounded-md px-3 py-2 text-sm text-zinc-300 hover:bg-zinc-900 hover:text-white" href="/admin/users">Users</a>
                <a class="rounded-md px-3 py-2 text-sm text-zinc-300 hover:bg-zinc-900 hover:text-white" href="/admin/incomplete-matches">Open Matches</a>
                <a class="rounded-md px-3 py-2 text-sm text-zinc-300 hover:bg-zinc-900 hover:text-white" href="/admin/matches">Matches</a>
                <a class="rounded-md px-3 py-2 text-sm text-zinc-300 hover:bg-zinc-900 hover:text-white" href="/admin/actions">Admin Actions</a>
            </nav>

            <div class="mt-8 flex items-center gap-3 border-t border-zinc-800 pt-5">
                {% if user.avatar_url %}
                    <img class="h-9 w-9 rounded-full" src="{{ user.avatar_url }}" alt="">
                {% else %}
                    <div class="h-9 w-9 rounded-full bg-zinc-800"></div>
                {% endif %}
                <div class="min-w-0">
                    <p class="truncate text-sm text-zinc-300">{{ user.username }}</p>
                    <a class="text-xs text-zinc-500 hover:text-zinc-300" href="/logout">Log out</a>
                </div>
            </div>
        </aside>

        <main class="px-6 py-8 lg:px-8">
            {% if notice %}
                <div class="mb-6 rounded-md border border-emerald-500/30 bg-emerald-500/10 px-4 py-3 text-sm text-emerald-200">
                    Action completed.
                </div>
            {% endif %}
            {% if error %}
                <div class="mb-6 rounded-md border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-200">
                    {{ error }}
                </div>
            {% endif %}
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
