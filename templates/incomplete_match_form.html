{% extends "admin_base.html" %}
{% block title %}{% if match %}Edit Open Match{% else %}New Open Match{% endif %} - KG Admin{% endblock %}
{% block content %}
<div class="mb-6">
    <a class="text-sm text-indigo-300 hover:text-indigo-200" href="/admin/incomplete-matches">Back to open matches</a>
    <h2 class="mt-3 text-2xl font-semibold tracking-tight">{% if match %}Edit open match{% else %}New open match{% endif %}</h2>
</div>

<form method="post" action="/admin/incomplete-matches/save" class="max-w-4xl rounded-lg border border-zinc-800 bg-zinc-900 p-6">
    {% if match %}<input type="hidden" name="id" value="{{ match.id }}">{% endif %}
    <div class="grid gap-5 md:grid-cols-3">
        <label class="space-y-2 md:col-span-3">
            <span class="text-sm font-medium text-zinc-300">Topic</span>
            <input name="topic" value="{{ match.topic if match else '' }}" required class="w-full rounded-md border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm text-zinc-100 focus:border-indigo-400 focus:outline-none">
        </label>
        <label class="space-y-2">
            <span class="text-sm font-medium text-zinc-300">Asker</span>
            <select name="asker_id" required class="w-full rounded-md border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm text-zinc-100 focus:border-indigo-400 focus:outline-none">
                {% for option_user in users %}
                    <option value="{{ option_user.discord_id }}" {% if match and match.asker.discord_id == option_user.discord_id %}selected{% endif %}>{{ option_user.discord_name }}</option>
                {% endfor %}
            </select>
        </label>
        <label class="space-y-2">
            <span class="text-sm font-medium text-zinc-300">Opposer</span>
            <select name="opposer_id" class="w-full rounded-md border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm text-zinc-100 focus:border-indigo-400 focus:outline-none">
                <option value="">TBA</option>
                {% for option_user in users %}
                    <option value="{{ option_user.discord_id }}" {% if match and match.opposer and match.opposer.discord_id == option_user.discord_id %}selected{% endif %}>{{ option_user.discord_name }}</option>
                {% endfor %}
            </select>
        </label>
        <label class="space-y-2">
            <span class="text-sm font-medium text-zinc-300">Judge</span>
            <select name="judge_id" class="w-full rounded-md border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm text-zinc-100 focus:border-indigo-400 focus:outline-none">
                <option value="">TBA</option>
                {% for option_user in users %}
                    <option value="{{ option_user.discord_id }}" {% if match and match.judge and match.judge.discord_id == option_user.discord_id %}selected{% endif %}>{{ option_user.discord_name }}</option>
                {% endfor %}
            </select>
        </label>
        <label class="flex items-center gap-3 rounded-md border border-zinc-800 bg-zinc-950 px-3 py-3">
            <input name="ongoing" type="checkbox" {% if not match or match.ongoing %}checked{% endif %} class="h-4 w-4 rounded border-zinc-600 bg-zinc-950 text-indigo-500">
            <span class="text-sm text-zinc-300">Ongoing</span>
        </label>
        <label class="flex items-center gap-3 rounded-md border border-zinc-800 bg-zinc-950 px-3 py-3">
            <input name="started" type="checkbox" {% if match and match.started %}checked{% endif %} class="h-4 w-4 rounded border-zinc-600 bg-zinc-950 text-indigo-500">
            <span class="text-sm text-zinc-300">Started</span>
        </label>
        <div></div>
        <label class="space-y-2">
            <span class="text-sm font-medium text-zinc-300">Started at</span>
            <input name="started_at" value="{{ match.started_at.isoformat() if match and match.started_at else '' }}" placeholder="2026-06-24T14:30:00+00:00" class="w-full rounded-md border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm text-zinc-100 focus:border-indigo-400 focus:outline-none">
        </label>
        <label class="space-y-2">
            <span class="text-sm font-medium text-zinc-300">Ended at</span>
            <input name="ended_at" value="{{ match.ended_at.isoformat() if match and match.ended_at else '' }}" placeholder="2026-06-24T15:30:00+00:00" class="w-full rounded-md border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm text-zinc-100 focus:border-indigo-400 focus:outline-none">
        </label>
    </div>
    <div class="mt-6 flex justify-end gap-3">
        <a class="rounded-md border border-zinc-700 px-4 py-2 text-sm text-zinc-200 hover:bg-zinc-800" href="/admin/incomplete-matches">Cancel</a>
        <button class="rounded-md bg-indigo-500 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-400" type="submit">Save open match</button>
    </div>
</form>
{% endblock %}
